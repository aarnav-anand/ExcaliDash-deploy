# Render Blueprint for a low-traffic personal ExcaliDash deployment.
#
# Before creating this Blueprint, create a Neon PostgreSQL project and copy its
# pooled connection string. Render prompts for the values marked `sync: false`.
# The two public URLs are assigned by Render after creation, so set/update both
# URL variables as described in docs/deploy/render-neon.md, then redeploy.
#
# This intentionally does not use a Render Postgres database: the free Render
# database expires. Neon supplies durable PostgreSQL storage instead.
services:
  - type: web
    runtime: docker
    name: excalidash-backend
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: DATABASE_PROVIDER
        value: postgresql
      # Use Neon's direct (non-pooler) connection string. This single-instance
      # service also runs Prisma migrations during startup.
      - key: DATABASE_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      # Set this to the exact HTTPS URL of the Render static site after it is
      # created, for example https://excalidash-frontend.onrender.com.
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: AUTH_MODE
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Set before creating API keys. Changing it later invalidates all keys.
      - key: API_KEY_HASH_PEPPER
        generateValue: true
      # Conservative limits are more appropriate for a 1 GB free database.
      - key: UPLOAD_MAX_MB
        value: "25"
      - key: BODY_LIMIT_MB
        value: "25"
      - key: FILE_UPLOAD_MAX_MB
        value: "10"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "2"
      - key: UPDATE_CHECK_OUTBOUND
        value: "false"

  - type: web
    runtime: static
    name: excalidash-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to the exact backend URL, with no trailing slash and no /api.
      # Example: https://excalidash-backend.onrender.com
      - key: VITE_API_URL
        sync: false
